# Weekly market report. An analyst orchestrates a SQL agent (production database, read-only)
# and a web-search agent, then posts the report to Slack.
name: analytics
description: An analyst delegates to a SQL agent and a web-search agent and posts a weekly report.
agents:
  - id: analyst
    purpose: Answer business questions and post the weekly market report to Slack.
    mounts:
      - {server: slack, tools: [slack_post_message]}
    delegates:
      - {to: sql, returns: text}
      - {to: web, returns: text}
  - id: sql
    purpose: Run read-only SQL against the production database.
    mounts:
      - {server: postgres}
  - id: web
    purpose: Search the web for competitor news.
    mounts:
      - {server: brave-search, tools: [brave_web_search]}
tasks:
  - {id: weekly-report, agent: analyst, needs: [postgres.query, brave-search.brave_web_search, slack.slack_post_message]}
