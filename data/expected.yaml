# Ground truth for `toxicflow eval` and tests/test_expected.py, derived by hand from each topology
# (not copied from detector output). Triples are (untrusted entry, private reader, outbound exit).
#
# Runtime cases: each step is [agent, tool, expected gate status]. A step expected BLOCK is an outbound
# call that could carry private data shaped by untrusted content; every other step is legitimate work.
# `repaired: true` runs the case after the cheapest repair the graph search finds has been applied.

scenarios:
  acme:
    # reach(triage)=reach(coder)=reach(researcher)={triage,coder,researcher,standup}; reach(standup)={standup}
    flows:
      - [triage, coder, triage]
      - [triage, coder, researcher]
      - [triage, coder, standup]
      - [researcher, coder, triage]
      - [researcher, coder, researcher]
      - [researcher, coder, standup]
      - [triage, standup, standup]
      - [researcher, standup, standup]
    per_agent: []
    min_repair_cost: 3
    runtime:
      - name: issue read, then a benign post
        steps: [[triage, github.get_issue, ALLOW], [triage, slack.slack_post_message, ALLOW]]
      - name: private data to Slack through the legitimate standup workflow (no untrusted input)
        steps:
          - [coder, filesystem.read_text_file, ALLOW]
          - [coder, memory.add_observations, ALLOW]
          - [standup, memory.read_graph, ALLOW]
          - [standup, slack.slack_post_message, ALLOW]
      - name: injected issue steers a private read, then exfiltration through delegation
        steps:
          - [triage, github.get_issue, ALLOW]
          - [coder, filesystem.read_text_file, ALLOW_TAINTED]
          - [triage, slack.slack_post_message, BLOCK]
          - [researcher, fetch.fetch, BLOCK]
      - name: injected text reaches standup through shared memory (no delegation edge)
        steps:
          - [triage, github.get_issue, ALLOW]
          - [standup, memory.read_graph, ALLOW_TAINTED]
          - [standup, slack.slack_post_message, BLOCK]
      - name: after repair, the same injection chain cannot carry the secret out
        repaired: true
        steps:
          - [triage, github.get_issue, ALLOW]
          - [coder, filesystem.read_text_file, ALLOW_TAINTED]
          - [triage, slack.slack_post_message, ALLOW]
          - [researcher, fetch.fetch, ALLOW]
      - name: after repair, fix-bug and standup-notes still work
        repaired: true
        steps:
          - [triage, github.get_issue, ALLOW]
          - [coder, filesystem.read_text_file, ALLOW_TAINTED]
          - [coder, filesystem.edit_file, ALLOW]
          - [standup, memory.read_graph, ALLOW]
          - [standup, slack.slack_post_message, ALLOW]

  analytics:
    flows: [[web, sql, analyst], [web, sql, web]]
    per_agent: []
    min_repair_cost: 1

  assistant:
    flows: [[assistant, assistant, assistant]]
    per_agent: [assistant]
    min_repair_cost: null   # every intervention removes a capability its only task needs

  github_solo:
    flows: [[maintainer, maintainer, maintainer]]
    per_agent: [maintainer]
    min_repair_cost: 3

  unlabelled:
    flows: []               # strict; flows through the unlabelled tool are UNKNOWN, never safe
    per_agent: []
    min_repair_cost: 0

  support:
    # reach(web)=reach(records)=reach(dispatcher)={dispatcher,web,records,notifier}; reach(notifier)={notifier}
    flows: [[web, records, notifier], [web, notifier, notifier]]
    per_agent: []
    min_repair_cost: 3      # quarantine dispatcher<-web plus isolating the notes store (either side)
    single_fix_that_breaks_work: [revoke, web, untrusted_input]   # removes both flows, breaks triage-ticket
    runtime:
      - name: ticket read and notes saved
        steps: [[web, github.get_issue, ALLOW], [web, memory.create_entities, ALLOW], [dispatcher, everything.echo, ALLOW]]
      - name: legitimate digest of private notes to Slack (no untrusted input in the session)
        steps: [[notifier, memory.read_graph, ALLOW], [notifier, slack.slack_post_message, ALLOW]]
      - name: injected ticket reaches the notifier through shared notes
        steps:
          - [web, github.get_issue, ALLOW]
          - [notifier, memory.read_graph, ALLOW_TAINTED]
          - [notifier, slack.slack_post_message, BLOCK]
      - name: injected ticket meets customer records in the tool-less dispatcher
        steps:
          - [web, github.get_issue, ALLOW]
          - [records, filesystem.read_text_file, ALLOW_TAINTED]
          - [notifier, slack.slack_post_message, BLOCK]
      - name: after repair, both routes are closed and the digest still posts
        repaired: true
        steps:
          - [web, github.get_issue, ALLOW]
          - [records, filesystem.read_text_file, ALLOW]
          - [notifier, memory.read_graph, ALLOW]
          - [notifier, slack.slack_post_message, ALLOW]

  support_safe:
    flows: []
    per_agent: []
    min_repair_cost: 0
    runtime:
      - name: same calls as the support injection, wired safely
        steps:
          - [web, github.get_issue, ALLOW]
          - [records, filesystem.read_text_file, ALLOW]
          - [notifier, memory.read_graph, ALLOW]
          - [notifier, slack.slack_post_message, ALLOW]
